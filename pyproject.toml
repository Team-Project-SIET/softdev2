[project]
name = "logistics-optimizer"
version = "0.1.0"
description = "Transport planning experimentation with OpenTTD and OpenTTDLab"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.13",
    "openttdlab==0.0.75",
    "ortools>=9.10",
    "psycopg[binary]>=3.1",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "sqlalchemy>=2.0",
    "textual>=0.58",
]

[project.scripts]
logistics-tui = "app.tui.app:main"
logistics-seed = "app.database.seed:main"
transport-experiment = "app.experiments.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["openttd: runs a real headless OpenTTD simulation through OpenTTDLab"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
